<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Upload Job</title>
    <!-- CSS taginput -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/taginput.css') }}">
    <!-- Boostrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icon Boostrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
     <nav class="navbar navbar-expand-md navbar-dark bg-dark fs-5">
        <div class="container-fluid">
            <a href="{{ url_for('jobs_route') }}" class="navbar-brand fs-4"><i class="bi bi-arrow-left"></i></a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card border-primary">
            <div class="card-header bg-primary text-white text-center fs-1 fw-bold">Job Form</div>
            <div class="card-body">
                <form action="{{ url_for('add_job_route') }}" method="POST" id="form-job">
                    <div class="mb-2"><label class="form-label">Name</label><input class="form-control" type="text" name="name" required></div>
                    <div class="mb-2"><label class="form-label">Company</label><input class="form-control" type="text" name="company" required></div>
                    <div class="mb-2"><label class="form-label">Location</label><input class="form-control" type="text" name="location" required></div>
                    <div class="mb-2"><label class="form-label">End Date</label><input class="form-control" type="date" name="enddate" required></div>
                    <div class="mb-3">
                        <label class="form-label">Tags</label>
                        <div class="wrapper">
                            <div class="content">
                                <ul>
                                    <input type="text" spellcheck="false" id="tags-input" placeholder="Input tag">
                                </ul>
                            </div>
                            <div class="details">
                                <p><span>10</span> tags</p>
                                <button type="button" class="remove-all-btn">Remove all</button>
                            </div>
                        </div>
                        <input type="hidden" name="tags" id="hiddentags" value=""> 
                    </div>

                    <div class="mb-2"><label class="form-label">Responsibilities</label><textarea class="form-control" name="responsibilities" required rows="3"></textarea></div>
                    <div class="mb-2"><label class="form-label">Skills</label><textarea class="form-control" name="skills" required rows="3"></textarea></div>
                    <div class="mb-2"><label class="form-label">Preferred Skills</label><textarea class="form-control" name="preskills" required rows="3"></textarea></div>
                    <div class="mb-2"><label class="form-label">Benefits</label><textarea class="form-control" name="benefits" required rows="3"></textarea></div>
                    <div class="mb-2"><label class="form-label">Link</label><input class="form-control" type="text" name="link" required></div>
                    
                    <button type="button" class="btn btn-primary mt-3 w-100" id="submitBtn">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <!-- JS taginput -->
    <script src="{{ url_for('static', filename='js/taginput.js') }}"></script>
    <script>
        document.getElementById("submitBtn").addEventListener("click", function() {
            const tagsArray = getTags();
            if (tagsArray.length === 0) { alert("Tags required!"); return; }
            if (confirm("Confirm save?")) {
                document.getElementById('hidden-tags').value = tagsArray.join('-');
                document.getElementById("form-job").submit();
            }
        });
    </script>
</body>
</html>
