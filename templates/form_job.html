<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--Tag-->
        <link rel="stylesheet" href="{{ url_for('static', filename='tag/style.css') }}">
        <!--Boostrap5-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <title>Form Upload Job</title>
    </head>
    <body>
         <nav class="navbar navbar-expand-md navbar-dark bg-secondary fs-5">
            <div class="container-fluid">
                <a href="{{ url_for('jobs_route') }}" class="navbar-brand fs-4" 
                onclick="return confirm('Bạn có chắc chắn muốn rời khỏi trang? Mọi thông tin đã nhập sẽ không được lưu lại.');">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
        </nav>

        <div class="container">
            <div class="row col-md-10 mx-auto">
                <div class="card border-primary" style="border-width: 2px; padding:0;">
                    <div class="card-header bg-primary text-white text-center fs-1 fw-bold">
                        Job Information Form
                    </div>
                    <div class="card-body">
                        <form action="/add_job" method="POST" id="form-job">
                            <div>
                                <label class="form-label" for="name">Name</label>
                                <input class="form-control" type="text" id="name" name="name" placeholder="Enter Name" required>
                            </div>
                            <div>
                                <label class="form-label" for="company">Company</label>
                                <input class="form-control" type="text" id="company" name="company" placeholder="Enter Company" required>
                            </div>
                            <div>
                                <label class="form-label" for="location">Location</label>
                                <input class="form-control" type="text" id="location" name="location" placeholder="Enter Location" required>
                            </div>
                            <div>
                                <label class="form-label" for="end_date">End Date</label>
                                <input class="form-control" type="date" id="end_date" name="end_date" required>
                            </div>
                            <div class="wrapper">
                                <label class="form-label" for="tags-input">Tags: Press enter or add a comma after each tag</label>
                                <div class="content">
                                    <ul>
                                        <input type="text" id="tags-input">
                                    </ul>
                                </div>
                                <div class="details">
                                    <p><span>_</span> tags are remaining</p> 
                                    <button type="button" class="remove-all-btn">Remove all</button>
                                </div>
                                <input type="hidden" name="tags" id="hidden-tags">
                            </div>
                            <div>
                                <label class="form-label" for="responsibilities">Responsibilities</label>
                                <textarea class="form-control" id="responsibilities" name="responsibilities" placeholder="Enter Responsibilities" required rows="3"></textarea>
                            </div>
                            <div>
                                <label class="form-label" for="skills">Skills</label>
                                <textarea class="form-control" id="skills" name="skills" placeholder="Enter Skills" required rows="3"></textarea>
                            </div>
                            <div>
                                <label class="form-label" for="preferred_skills">Preferred_skills</label>
                                <textarea class="form-control" id="preferred_skills" name="preferred_skills" placeholder="Enter Preferred Skills" required rows="3"></textarea>
                            </div>
                            <div>
                                <label class="form-label" for="benefits">Benefits</label>
                                <textarea class="form-control" id="benefits" name="benefits" placeholder="Enter Benefits" required rows="3"></textarea>
                            </div>
                            <div>
                                <label class="form-label" for="link">Link</label>
                                <input class="form-control" type="text" id="link" name="link" placeholder="Enter Link" required>
                            </div>
                            <button type="button" class="btn btn-primary center" id="submitBtn">Submit</button>
                        </form>
                    </div>
                    <div class="card-footer text-end">
                        <small>&copy; 4gotten</small>
                    </div>
                </div>
            </div>
        </div>

        <script src="{{ url_for('static', filename='tag/script.js') }}"></script>
        <script>
        document.getElementById("submitBtn").addEventListener("click", function() {
            const name = document.getElementById("name").value.trim();
            const company = document.getElementById("company").value.trim();
            const locationInput = document.getElementById("location").value.trim();
            const responsibilities = document.getElementById("responsibilities").value.trim();
            const skills = document.getElementById("skills").value.trim();
            const preferred_skills = document.getElementById("preferred_skills").value.trim();
            const benefits = document.getElementById("benefits").value.trim();
            const link = document.getElementById("link").value.trim();
            const tagsArray = getTags();

            let errors = [];
            if (name === "") {
                errors.push("- Name");
            }
            if (company === "") {
                errors.push("- Company");
            }
            if (locationInput === "") {
                errors.push("- Location");
            }
            if (end_date === "") {
                errors.push("- Post Date");
            }
            if (tagsArray.length === 0) { 
                errors.push("- Tags (minimum 1 tag)");
            }
            if (responsibilities === "") {
                errors.push("- Responsibilities");
            }
            if (skills === "") {
                errors.push("- Skills");
            }
            if (preferred_skills === "") {
                errors.push("- Preferred Skills");
            }
            if (benefits === "") {
                errors.push("- Benefits");
            }
            if (link === "") {
                errors.push("- Link");
            }

            if (errors.length > 0) {
                alert("Vui lòng điền đầy đủ các thông tin sau:\n" + errors.join("\n"));
            } else {
                const confirmed = confirm("Bạn có chắc chắn rằng thông tin đã đúng chưa?");
                if (confirmed) {
                    const tagsString = tagsArray.join('-');
                    document.getElementById('hidden-tags').value = tagsString;
                    document.getElementById("form-job").submit();
                } else {
                    alert("Bạn có thể kiểm tra lại thông tin.");
                }
            }
        });
        </script>
    </body>
</html>
