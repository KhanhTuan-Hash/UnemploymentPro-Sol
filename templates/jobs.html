<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title>Job Information</title>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-secondary fs-5">
        <div class="container-fluid">
            <a href="{{ url_for('index') }}" class="navbar-brand fs-4">
                <i class="bi bi-house-door-fill"></i>
            </a>
            <a href="{{ url_for('form_job_route') }}" class="btn btn-primary">Upload Job</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <h2 class="mb-3">Jobs List ({{ jobs|length }})</h2>
                <ul class="list-group">
                    {% for job in jobs %}
                        <li class="list-group-item d-flex flex-wrap justify-content-between align-items-center">
                            <div class="me-auto my-1">
                                <h5 class="mb-1">{{ job[1] }} <span class="badge bg-primary rounded-pill">{{ job[11] }} pts</span></h5>
                                <small class="text-muted">{{ job[2] }} - {{ job[3] }} | End date: {{ job[10] }}</small>
                            </div>
                            <div class="my-1">
                                <a href="{{ url_for('update_job_route', id=job[0]) }}" class="btn btn-outline-secondary btn-sm me-2">
                                    <i class="bi bi-pencil-square"></i> Edit
                                </a>
                                <a href="{{ url_for('delete_job_route', id=job[0]) }}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to delete this job?');">
                                    <i class="bi bi-trash-fill"></i> Delete
                                </a>
                            </div>
                        </li>
                    {% else %}
                        <li class="list-group-item text-center">No jobs found. <a href="{{ url_for('form_job_route') }}">Upload one now!</a></li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
