<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='tag/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title>Update Job</title>
</head>
<body class="bg-white">
    <nav class="navbar navbar-expand-md navbar-dark bg-secondary fs-5">
        <div class="container-fluid">
            <a href="{{ url_for('jobs_route') }}" class="navbar-brand fs-4">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="navbar-brand mx-auto">Update Job Information</span>
            <span style="width: 50px;"></span>
        </div>
    </nav>
    
    <div class="container">
        <div class="row col-md-8 mx-auto">
            <div class="card border-primary" style="border-width: 2px; padding:0; margin-top: 20px;">
                <div class="card-header bg-primary text-white text-center fs-1 fw-bold">
                    Update Job Form
                </div>
                <div class="card-body">
                    <form action="{{ url_for('update_job_route', id=job[0]) }}" method="POST" id="form-job">
                        
                        <div>
                            <label class="form-label" for="name">Name</label>
                            <input class="form-control" type="text" id="name" name="name" value="{{ job[1] }}" required>
                        </div>
                        <div>
                            <label class="form-label" for="company">Company</label>
                            <input class="form-control" type="text" id="company" name="company" value="{{ job[2] }}" required>
                        </div>
                        <div>
                            <label class="form-label" for="location">Location</label>
                            <input class="form-control" type="text" id="location" name="location" value="{{ job[3] }}" required>
                        </div>
                        <div>
                            <label class="form-label" for="end_date">End Date</label>
                            <input class="form-control" type="date" id="end_date" name="end_date" value="{{ job[10] }}" required>
                        </div>

                        <div class="wrapper">
                            <label class="form-label" for="tags-input">Tags: Press enter or add a comma after each tag</label>
                            <div class="content"> 
                                <ul></ul>
                                <input type="text" id="tags-input"> 
                            </div>
                            <div class="details">
                                <p><span>_</span> tags are remaining</p> 
                                <button type="button" class="remove-all-btn">Remove all</button>
                            </div>
                            <input type="hidden" name="tags" id="hidden-tags">
                        </div>
                        
                        <div>
                            <label class="form-label" for="responsibilities">Responsibilities</label>
                            <textarea class="form-control" id="responsibilities" name="responsibilities" required rows="3">{{ job[5] }}</textarea>
                        </div>
                        <div>
                            <label class="form-label" for="skills">Skills</label>
                            <textarea class="form-control" id="skills" name="skills" required rows="3">{{ job[6] }}</textarea>
                        </div>
                        <div>
                            <label class="form-label" for="preferred_skills">Preferred Skills</label>
                            <textarea class="form-control" id="preferred_skills" name="preferred_skills" required rows="3">{{ job[7] }}</textarea>
                        </div>
                        <div>
                            <label class="form-label" for="benefits">Benefits</label>
                            <textarea class="form-control" id="benefits" name="benefits" required rows="3">{{ job[8] }}</textarea>
                        </div>
                        <div>
                            <label class="form-label" for="link">Link</label>
                            <input class="form-control" type="text" id="link" name="link" value="{{ job[9] }}" required>
                        </div>

                        <button type="button" class="btn btn-primary center mt-3" id="submitBtn">Update Job</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='tag/script.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const initialTagsString = "{{ job[4] or '' }}"; 
            if (initialTagsString) {
                tags = initialTagsString.split('-');
                createTag();
            }
        });

        document.getElementById("submitBtn").addEventListener("click", function() {
            const name = document.getElementById("name").value.trim();
            const company = document.getElementById("company").value.trim();
            const locationInput = document.getElementById("location").value.trim();
            const end_date = document.getElementById("end_date").value;
            const tagsArray = getTags();
            const responsibilities = document.getElementById("responsibilities").value.trim();
            const skills = document.getElementById("skills").value.trim();
            const preferred_skills = document.getElementById("preferred_skills").value.trim();
            const benefits = document.getElementById("benefits").value.trim();
            const link = document.getElementById("link").value.trim();

            let errors = [];
            if (name === "") errors.push("- Name");
            if (company === "") errors.push("- Company");
            if (locationInput === "") errors.push("- Location");
            if (end_date === "") errors.push("- End Date");
            if (tagsArray.length === 0) errors.push("- Tags (phải có ít nhất 1 tag)");
            if (responsibilities === "") errors.push("- Responsibilities");
            if (skills === "") errors.push("- Skills");
            if (preferred_skills === "") errors.push("- Preferred Skills");
            if (benefits === "") errors.push("- Benefits");
            if (link === "") errors.push("- Link");

            if (errors.length > 0) {
                alert("Vui lòng điền đầy đủ các thông tin sau:\n" + errors.join("\n"));
            } else {
                const confirmed = confirm("Bạn có chắc chắn muốn cập nhật thông tin này?");
                if (confirmed) {
                    const tagsString = tagsArray.join('-');
                    document.getElementById('hidden-tags').value = tagsString;
                    document.getElementById("form-job").submit();
                }
            }
        });
    </script>
</body>
</html>
